name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The substrate's own validators are Python (stdlib + PyYAML),
      # regardless of the project's primary language.
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Bootstrap toolchain (python)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            pipx install uv
            uv sync --group dev
          else
            python -m pip install --upgrade pip PyYAML pre-commit
          fi
      - name: Node toolchain
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Node install
        if: hashFiles('package.json') != ''
        run: npm ci || npm install
      - name: Go toolchain
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with: {go-version: "stable"}
      - name: Substrate setup (creates .substrate/venv with validators)
        run: ./manage.sh setup
      - name: Doctor (readiness — --strict for strict profile, else --operational)
        run: |
          MODE=--operational
          grep -q 'SUBSTRATE_PROFILE="strict"' .substrate/config && MODE=--strict
          ./manage.sh doctor "$MODE"
      - name: Substrate + language checks
        run: ./manage.sh check
      # Closure signal: this repo's PR watcher receives comment webhooks but
      # not CI-success, so a green run is otherwise invisible to it. Re-emit
      # the terminal state as a comment (the channel the watcher DOES receive),
      # delete-and-repost so exactly one lands per green run and a `created`
      # event fires each time. Same-repo PRs only (fork tokens are read-only).
      - name: Signal CI-green
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- ci-green-signal -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const short = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `✅ **CI green** for \`${short}\` — all checks passed on this commit.`,
              '',
              'Machine-authored closure signal. It is re-posted (delete + create) on'
              + ' each green run so a watcher keyed on the head commit sees exactly one'
              + ' event per commit and dedupes on the SHA.',
            ].join('\n');
            const prior = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            for (const c of prior) {
              if (c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
